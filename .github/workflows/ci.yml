# Validates that marketplace.json and every plugin.json is syntactically valid JSON.
# Runs on every push to main and every PR.
name: CI

run-name: "CI — ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: "JSON Validation — ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON files
        id: validate
        run: |
          {
            echo "## JSON Validation"
            echo ""
            echo "| File | Result |"
            echo "|------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0

          validate() {
            local file="$1"
            if python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "| \`$file\` | :white_check_mark: Valid |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$file\` | :x: Invalid |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error file=$file::Invalid JSON"
              status=1
            fi
          }

          validate .claude-plugin/marketplace.json
          while IFS= read -r -d '' f; do
            validate "$f"
          done < <(find plugins -name plugin.json -print0)

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ $status -eq 0 ]; then
            echo ":white_check_mark: **All JSON files valid**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":x: **Invalid JSON detected** — see errors above" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit $status

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs every plugins/**/*.test.sh. Each suite must be hermetic (no
      # network, no real repos) and exit non-zero on failure.
      - name: Run shell test suites
        run: |
          {
            echo "## Shell Tests"
            echo ""
            echo "| Suite | Result |"
            echo "|-------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          while IFS= read -r -d '' t; do
            echo "::group::$t"
            if bash "$t"; then
              echo "| \`$t\` | :white_check_mark: Passed |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$t\` | :x: Failed |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error file=$t::Shell test suite failed"
              status=1
            fi
            echo "::endgroup::"
          done < <(find plugins -name '*.test.sh' -print0)
          exit $status

  mod-tests:
    name: Mod Tests
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs `claude plugin test` for every plugin that ships mod tests
      # (*.test.ts). The tests answer gh/clock/UI from fixtures: no sign-in,
      # no network. The Claude Code version is pinned; bump it deliberately.
      # ubuntu-latest's preinstalled Node/npm is enough (no setup-node).
      # The postinstall that fetches the native binary is run explicitly, so
      # an npm that skips install scripts still ends with a working claude.
      - name: Install Claude Code
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/claude-code" @anthropic-ai/claude-code@2.1.287
          node "$RUNNER_TEMP/claude-code/node_modules/@anthropic-ai/claude-code/install.cjs"
          echo "$RUNNER_TEMP/claude-code/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run mod test suites
        run: |
          {
            echo "## Mod Tests"
            echo ""
            echo "| Plugin | Result |"
            echo "|--------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          while IFS= read -r plugin; do
            echo "::group::$plugin"
            if claude plugin test "$plugin"; then
              echo "| \`$plugin\` | :white_check_mark: Passed |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$plugin\` | :x: Failed |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Mod tests failed in $plugin"
              status=1
            fi
            echo "::endgroup::"
          done < <(find plugins -name '*.test.ts' -not -path '*/node_modules/*' | cut -d/ -f1-2 | sort -u)
          exit $status

  ci:
    name: CI
    if: always()
    needs: [validate, shell-tests, mod-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=("${{ needs.validate.result }}" "${{ needs.shell-tests.result }}" "${{ needs.mod-tests.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "CI failed"
              exit 1
            fi
          done
          echo "All checks passed"
